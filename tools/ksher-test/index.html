<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สร้าง QR รับเงิน — Ksher</title>
<style>
  :root{--paper:#f4f6f8;--surface:#fff;--ink:#111827;--soft:#4b5563;--faint:#9099a6;
        --line:#dfe4ea;--jade:#0f766e;--jade-soft:#e6f2f0;--loss:#a8251c;--wait:#8a6212;--sunk:#eef1f4}
  @media (prefers-color-scheme:dark){:root{--paper:#0d1014;--surface:#161a20;--ink:#e8ebef;
        --soft:#a3abb8;--faint:#6b7280;--line:#252b34;--jade:#45c4b2;--jade-soft:#0f2f2b;
        --loss:#f27866;--wait:#d9a441;--sunk:#1a1f26}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);line-height:1.65;
       font-family:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif}
  .wrap{max-width:40rem;margin:0 auto;padding:2rem 1.25rem 4rem;display:flex;flex-direction:column;gap:1.5rem}
  h1{font-size:1.35rem;margin:0;letter-spacing:-.02em}
  .sub{color:var(--soft);font-size:.9rem;margin:0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.4rem;
        display:flex;flex-direction:column;gap:1rem}
  label{display:flex;flex-direction:column;gap:.35rem;font-size:.85rem;color:var(--soft)}
  input,select{font:inherit;padding:.6rem .75rem;border:1px solid var(--line);border-radius:4px;
        background:var(--paper);color:var(--ink)}
  #amount{font-size:1.6rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
  input:focus,select:focus{outline:2px solid var(--jade);outline-offset:1px}
  button{font:inherit;font-weight:600;padding:.75rem 1rem;border-radius:4px;border:1px solid transparent;
        background:var(--jade);color:#fff;cursor:pointer;font-size:1rem}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--soft);border-color:var(--line);font-size:.88rem;padding:.5rem .9rem}
  .qrbox{display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:1.5rem 1rem;
        background:#fff;border-radius:6px;border:1px solid var(--line)}
  .qrbox img{width:300px;height:300px;max-width:100%;display:block}
  .amt{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;color:#111827}
  .status{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:1rem;padding:.6rem 1rem;
        border-radius:4px;justify-content:center}
  .st-wait{color:var(--wait);background:color-mix(in srgb,var(--wait) 12%,transparent)}
  .st-ok{color:var(--jade);background:var(--jade-soft)}
  .st-bad{color:var(--loss);background:color-mix(in srgb,var(--loss) 12%,transparent)}
  .dot{width:.55rem;height:.55rem;border-radius:50%;background:currentColor;animation:p 1.4s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  .meta{font-size:.78rem;color:var(--faint);display:flex;flex-direction:column;gap:.15rem;
        font-family:"IBM Plex Mono",ui-monospace,monospace;word-break:break-all}
  .err{color:var(--loss);font-size:.88rem;background:color-mix(in srgb,var(--loss) 10%,transparent);
       padding:.7rem .9rem;border-radius:4px}
  details{font-size:.85rem;color:var(--soft)}
  summary{cursor:pointer;padding:.3rem 0}
  .adv{display:flex;flex-direction:column;gap:.7rem;padding-top:.6rem}
  pre{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:.7rem;overflow:auto;
      font-size:.72rem;margin:0;max-height:16rem;font-family:"IBM Plex Mono",ui-monospace,monospace}
  .warn{color:var(--loss);font-size:.85rem}
  .row{display:flex;gap:.6rem;flex-wrap:wrap}
  .row>*{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>สร้าง QR รับเงิน</h1>
    <p class="sub">PromptPay ผ่าน Ksher · สแกนแล้วระบบจะเช็คให้เองว่าเงินเข้าหรือยัง</p>
    <p class="warn" id="nokey" hidden>ยังไม่มีกุญแจส่วนตัวใน .env.local</p>
  </div>

  <form class="card" id="f">
    <label>จำนวนเงิน (บาท)
      <input id="amount" inputmode="decimal" value="10.00" required>
    </label>
    <button type="submit" id="go">สร้าง QR</button>
    <details>
      <summary>ตัวเลือกเพิ่มเติม</summary>
      <div class="adv">
        <div class="row">
          <label>ช่องทาง
            <select id="channel">
              <option value="promptpay">promptpay</option>
              <option value="truemoney">truemoney</option>
              <option value="alipay">alipay</option>
              <option value="alipayplus">alipayplus</option>
              <option value="wechat">wechat</option>
              <option value="airpay">airpay</option>
              <option value="scb_qrcard">scb_qrcard</option>
            </select>
          </label>
          <label>หมดอายุ (วินาที)
            <input id="expire_time" inputmode="numeric" value="900">
          </label>
        </div>
        <label>appid
          <input id="appid" placeholder="mch43525">
        </label>
      </div>
    </details>
  </form>

  <div id="out"></div>

  <details>
    <summary>คำตอบดิบ</summary>
    <pre id="raw">ยังไม่ได้ยิง</pre>
  </details>
</div>

<script>
  const D = __DEFAULTS__;
  const $ = (id) => document.getElementById(id);
  if (D.appid) $('appid').value = D.appid;
  if (!D.hasPrivateKey) $('nokey').hidden = false;

  let poll = null;      // ตัวจับเวลาเช็คสถานะ
  let countdown = null; // ตัวจับเวลานับถอยหลังหมดอายุ

  const stop = () => { clearInterval(poll); clearInterval(countdown); poll = countdown = null; };

  const money = (n) => Number(n).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function showStatus(kind, text, spinning) {
    const el = $('st');
    if (!el) return;
    el.className = 'status st-' + kind;
    el.innerHTML = (spinning ? '<span class="dot"></span>' : '') + '<span>' + text + '</span>';
  }

  // ข้อความสถานะตามที่เอกสาร Ksher ระบุไว้
  const LABEL = {
    SUCCESS: ['ok', 'จ่ายเงินเรียบร้อยแล้ว'],
    NOTPAY: ['wait', 'ยังไม่ได้จ่าย — รอสแกน'],
    USERPAYING: ['wait', 'ลูกค้ากำลังกดยืนยัน'],
    PENDING: ['wait', 'กำลังดำเนินการ'],
    PAYERROR: ['bad', 'จ่ายไม่สำเร็จ'],
    CLOSED: ['bad', 'รายการถูกปิดแล้ว'],
    FAIL: ['bad', 'รายการล้มเหลว'],
    NOTSURE: ['bad', 'สถานะไม่แน่ชัด ให้ถามซ้ำอีกครั้ง'],
    REFUND: ['bad', 'คืนเงินแล้ว'],
  };

  async function checkStatus(order, channel) {
    try {
      const r = await fetch('/query', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ appid: $('appid').value.trim(), mch_order_no: order, channel }),
      });
      const j = await r.json();
      if (j.errors) return;
      const result = j.body && j.body.data && j.body.data.result;
      if (!result) return;
      const [kind, text] = LABEL[result] || ['wait', result];
      showStatus(kind, text, kind === 'wait');
      if (kind !== 'wait') {
        stop();
        $('raw').textContent = 'สถานะล่าสุด:\n' + JSON.stringify(j.body, null, 2);
      }
    } catch (e) { /* เงียบไว้ รอบหน้าค่อยลองใหม่ */ }
  }

  $('f').onsubmit = async (e) => {
    e.preventDefault();
    stop();
    $('go').disabled = true;
    $('out').innerHTML = '<div class="card"><p class="sub">กำลังสร้าง QR…</p></div>';

    const amountBaht = $('amount').value.trim();
    const channel = $('channel').value;
    const order = 'T' + Date.now() + Math.floor(Math.random() * 100);
    const expire = $('expire_time').value.trim();

    try {
      const r = await fetch('/create', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          appid: $('appid').value.trim(), amountBaht, channel,
          mch_order_no: order, img_type: 'png', expire_time: expire,
        }),
      });
      const j = await r.json();
      $('raw').textContent = JSON.stringify(j.body || j, null, 2);

      if (j.errors) {
        $('out').innerHTML = '<div class="card"><div class="err">' + j.errors.map((x) => '• ' + x).join('<br>') + '</div></div>';
        return;
      }
      const d = j.body && j.body.data;
      if (!(j.body && j.body.code === 0 && d && d.imgdat)) {
        const b = j.body || {};
        const msg = (b.data && (b.data.err_msg || b.data.result)) || b.msg || 'Ksher ไม่ได้ตอบว่าสำเร็จ';
        $('out').innerHTML = '<div class="card"><div class="err">' + msg + '</div></div>';
        return;
      }

      const src = d.imgdat.indexOf('data:') === 0 ? d.imgdat : 'data:image/png;base64,' + d.imgdat;
      $('out').innerHTML =
        '<div class="card">' +
          '<div class="qrbox">' +
            '<img alt="QR สำหรับสแกนจ่าย" src="' + src + '">' +
            '<div class="amt">฿' + money(amountBaht) + '</div>' +
          '</div>' +
          '<div class="status st-wait" id="st"><span class="dot"></span><span>รอสแกน</span></div>' +
          '<div class="row">' +
            '<button type="button" class="ghost" id="recheck">เช็คสถานะเดี๋ยวนี้</button>' +
            '<button type="button" class="ghost" id="stopbtn">หยุดเช็ค</button>' +
          '</div>' +
          '<div class="meta">' +
            '<span>order: ' + order + '</span>' +
            '<span>ksher: ' + (d.ksher_order_no || '-') + '</span>' +
            '<span>ส่งไป ' + (j.sentParams && j.sentParams.total_fee) + ' สตางค์</span>' +
            '<span id="cd"></span>' +
            '<span>ลายเซ็นคำตอบ: ' + (j.responseSignatureValid === true ? 'ถูกต้อง' : j.responseSignatureValid === false ? 'ไม่ถูกต้อง' : 'ไม่ได้ตรวจ') + '</span>' +
          '</div>' +
        '</div>';

      $('recheck').onclick = () => checkStatus(order, channel);
      $('stopbtn').onclick = () => { stop(); showStatus('wait', 'หยุดเช็คแล้ว', false); };

      // เช็คทุก 3 วินาที และนับถอยหลังจนหมดอายุ
      poll = setInterval(() => checkStatus(order, channel), 3000);
      let left = Number(expire) || 900;
      countdown = setInterval(() => {
        left -= 1;
        const el = $('cd');
        if (el) el.textContent = left > 0
          ? 'หมดอายุใน ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0')
          : 'หมดอายุแล้ว';
        if (left <= 0) { stop(); showStatus('bad', 'QR หมดอายุแล้ว', false); }
      }, 1000);
    } catch (err) {
      $('out').innerHTML = '<div class="card"><div class="err">ติดต่อเซิร์ฟเวอร์ไม่ได้: ' + err.message + '</div></div>';
    } finally {
      $('go').disabled = false;
    }
  };
</script>
</body>
</html>
