<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ทดสอบ Payso PromptPay</title>
<style>
  :root {
    --paper:#f6f7f9; --surface:#fff; --ink:#141a2e; --soft:#4b5268; --faint:#868da0;
    --line:#e0e4eb; --jade:#0f766e; --loss:#a8251c; --sunk:#edeff3;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#0e1116;--surface:#161a21;--ink:#e9ebf0;--soft:#a6adbc;--faint:#6f7787;
          --line:#262c37;--jade:#45c4b2;--loss:#f27866;--sunk:#1b2029;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:56rem;margin:0 auto;padding:2rem 1.25rem 4rem;display:flex;flex-direction:column;gap:1.5rem}
  h1{font-size:1.5rem;margin:0;letter-spacing:-.02em}
  .sub{color:var(--soft);font-size:.92rem;margin:0}
  .grid{display:grid;grid-template-columns:1fr;gap:1.25rem}
  @media(min-width:52rem){.grid{grid-template-columns:1fr 1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1.25rem;display:flex;flex-direction:column;gap:.9rem}
  label{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem;color:var(--soft)}
  input{font:inherit;font-size:.92rem;padding:.5rem .65rem;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink)}
  input:focus{outline:2px solid var(--jade);outline-offset:1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  button{font:inherit;font-weight:600;padding:.6rem 1rem;border-radius:3px;border:1px solid transparent;background:var(--jade);color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--soft);border-color:var(--line)}
  pre{background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:.75rem;overflow:auto;font-size:.78rem;margin:0;max-height:22rem;font-family:"IBM Plex Mono",ui-monospace,monospace}
  .qr{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1rem;background:#fff;border-radius:4px}
  .qr img{width:260px;height:260px;image-rendering:pixelated}
  .err{color:var(--loss);font-size:.88rem;background:color-mix(in srgb,var(--loss) 10%,transparent);padding:.6rem .8rem;border-radius:3px}
  .ok{color:var(--jade);font-weight:600;font-size:.9rem}
  .meta{font-size:.82rem;color:var(--faint);display:flex;flex-direction:column;gap:.2rem;font-family:"IBM Plex Mono",ui-monospace,monospace}
  .hint{font-size:.78rem;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>ทดสอบสร้าง QR PromptPay ผ่าน Payso</h1>
    <p class="sub">ยิงไปที่ <code>apis.paysolutions.asia/tep/api/v2/promptpaynew</code> ผ่านเซิร์ฟเวอร์ในเครื่อง ไม่แตะระบบจริง</p>
  </div>

  <div class="grid">
    <form class="card" id="f">
      <label>merchantID <span class="hint">ตัวเลข 8 หลัก</span>
        <input id="merchantID" inputmode="numeric" placeholder="12345678" required>
      </label>
      <label>Bearer token <span class="hint">ไม่ถูกส่งไปที่เบราว์เซอร์ของใคร อยู่แค่ในเครื่องนี้</span>
        <input id="token" type="password" placeholder="วาง token" required>
      </label>
      <div class="row">
        <label>total (บาท) <span class="hint">ขั้นต่ำ 6</span>
          <input id="total" inputmode="decimal" value="6.00" required>
        </label>
        <label>referenceNo <span class="hint">12 หลัก ห้ามซ้ำ</span>
          <input id="referenceNo" inputmode="numeric" required>
        </label>
      </div>
      <label>customerName
        <input id="customerName" value="ทดสอบ ระบบ" required>
      </label>
      <label>customerEmail
        <input id="customerEmail" type="email" value="test@example.com" required>
      </label>
      <label>productDetail
        <input id="productDetail" value="ทดสอบสร้าง QR" required>
      </label>
      <div class="row">
        <button type="submit" id="go">สร้าง QR</button>
        <button type="button" class="ghost" id="newref">สุ่ม referenceNo ใหม่</button>
      </div>
      <p class="hint">referenceNo ซ้ำจะโดนปฏิเสธ ปุ่มสุ่มใช้เวลาปัจจุบันเป็นฐานจึงไม่ซ้ำกันเอง</p>
    </form>

    <div class="card">
      <div id="out"><p class="sub">ผลลัพธ์จะขึ้นตรงนี้</p></div>
    </div>
  </div>

  <div class="card">
    <strong style="font-size:.9rem">คำตอบดิบจาก Payso</strong>
    <pre id="raw">ยังไม่ได้ยิง</pre>
  </div>
</div>

<script>
  const D = __DEFAULTS__;
  const $ = (id) => document.getElementById(id);
  if (D.merchantID) $('merchantID').value = D.merchantID;
  if (D.token) $('token').value = D.token;

  // 12 หลักจากเวลาปัจจุบัน ท้ายด้วยสุ่มกันชนกันเองเวลากดรัวๆ
  const newRef = () => {
    const t = new Date();
    const p = (n, l) => String(n).padStart(l, '0');
    return p(t.getFullYear() % 100, 2) + p(t.getMonth() + 1, 2) + p(t.getDate(), 2) +
           p(t.getHours(), 2) + p(t.getMinutes(), 2) + p(Math.floor(Math.random() * 100), 2);
  };
  $('referenceNo').value = newRef();
  $('newref').onclick = () => { $('referenceNo').value = newRef(); };

  $('f').onsubmit = async (e) => {
    e.preventDefault();
    $('go').disabled = true;
    $('out').innerHTML = '<p class="sub">กำลังยิง…</p>';
    const payload = {};
    for (const k of ['merchantID','token','total','referenceNo','customerName','customerEmail','productDetail'])
      payload[k] = $(k).value.trim();

    try {
      const r = await fetch('/create', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      const j = await r.json();
      $('raw').textContent = JSON.stringify(j, null, 2);

      if (j.errors) {
        $('out').innerHTML = '<div class="err">' + j.errors.map((x) => '• ' + x).join('<br>') + '</div>';
        return;
      }
      const d = j.body && j.body.data;
      if (j.body && j.body.status === 'success' && d && d.image) {
        $('out').innerHTML =
          '<p class="ok">สำเร็จ · HTTP ' + j.httpStatus + ' · ' + j.ms + ' ms</p>' +
          '<div class="qr"><img alt="QR PromptPay" src="' + d.image + '"></div>' +
          '<div class="meta">' +
            '<span>orderNo: ' + d.orderNo + '</span>' +
            '<span>referenceNo: ' + d.referenceNo + '</span>' +
            '<span>total: ' + d.total + '</span>' +
            '<span>สร้าง: ' + (d.orderdatetime || '-') + '</span>' +
            '<span>หมดอายุ: ' + (d.expiredate || '(ไม่ได้ส่งมา)') + '</span>' +
          '</div>';
      } else {
        const msg = (j.body && (j.body.message || j.body._parseError)) || 'Payso ไม่ได้ตอบว่าสำเร็จ';
        $('out').innerHTML = '<div class="err">' + msg + ' · HTTP ' + j.httpStatus + '</div>';
      }
    } catch (err) {
      $('out').innerHTML = '<div class="err">ติดต่อเซิร์ฟเวอร์ในเครื่องไม่ได้: ' + err.message + '</div>';
    } finally {
      $('go').disabled = false;
    }
  };
</script>
</body>
</html>
